name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev aidl

    - name: Install Python dependencies
      run: |
        pip3 install --user buildozer cython virtualenv

    - name: Force Symlink AIDL to Buildozer cache (version 37)
      run: |
        # Создаем папку с версией 37.0.0
        mkdir -p $HOME/.buildozer/android/platform/android-sdk/build-tools/37.0.0
        
        # Копируем системный aidl туда
        cp $(which aidl) $HOME/.buildozer/android/platform/android-sdk/build-tools/37.0.0/aidl
        chmod +x $HOME/.buildozer/android/platform/android-sdk/build-tools/37.0.0/aidl
        
        # Добавляем в окружение
        echo "AIDL=$(which aidl)" >> $GITHUB_ENV

    - name: Build with Buildozer
      run: |
        export PATH=$PATH:~/.local/bin
        export AIDL=$(which aidl)
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FPE-APK
        path: bin/*.apk
