name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/setup-python@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Install system dependencies including AIDL
      run: |
        sudo apt-get update
        # Устанавливаем aidl напрямую из системных репозиториев Ubuntu
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev aidl

    - name: Install Python dependencies
      run: |
        pip3 install --user buildozer cython virtualenv

    - name: Build with Buildozer
      run: |
        export PATH=$PATH:~/.local/bin
        # Указываем Buildozer'у, где именно лежит системный aidl
        export AIDL=$(which aidl)
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FPE-APK
        path: bin/*.apk
