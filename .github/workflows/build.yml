name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev aidl

    - name: Install Python dependencies
      run: |
        pip3 install --user buildozer cython virtualenv

    - name: Force Download Build-Tools (no license prompt)
      run: |
        # Создаем папку SDK
        mkdir -p $HOME/android-sdk
        
        # Скачиваем build-tools 34.0.0 напрямую (там есть aidl)
        wget -q https://dl.google.com/android/repository/build-tools_r34-linux.zip -O build-tools.zip
        unzip -q build-tools.zip -d $HOME/android-sdk
        mv $HOME/android-sdk/android-14 $HOME/android-sdk/build-tools
        
        # Говорим системе, где SDK
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
        echo "$HOME/android-sdk/build-tools" >> $GITHUB_PATH

    - name: Build with Buildozer
      run: |
        export PATH=$PATH:~/.local/bin
        export AIDL=$(which aidl)
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FPE-APK
        path: bin/*.apk
